ble:
  device_name: IR Blaster
  # Same value as firmware BLE_AUTH_TOKEN (16–64 characters).
  auth_token: ''
events:
  OnConnect:
  - NamedCommand: 'On'
    Delay: 0
  - NamedCommand: Green
    Delay: 2
  OnDisconnect:
  - NamedCommand: 'Off'
    Delay: 900
  Active:
  - NamedCommand: Red
    Delay: 0
  Idle:
  - NamedCommand: Green
    Delay: 120
